name: Release

# Bij elke tag v<x.y.z> een GitHub-release maken, zodat HACS de update toont
# in Instellingen → Updates. De notities komen uit de changelog in README.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie controleren
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          JS=$(grep -oP 'CARD_VERSION = "\K[0-9.]+' custom_components/notes_manager/frontend/notes-manager-card.js)
          MANIFEST=$(python3 -c "import json; print(json.load(open('custom_components/notes_manager/manifest.json'))['version'])")
          echo "tag=$TAG js=$JS manifest=$MANIFEST"
          if [ "$TAG" != "$JS" ] || [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag v$TAG komt niet overeen met CARD_VERSION $JS of manifest $MANIFEST"
            exit 1
          fi

      - name: Notities uit de changelog halen
        run: |
          awk -v v="### ${GITHUB_REF_NAME}" '
            $0 == v { on = 1; next }
            on && /^### / { exit }
            on && /^## / { exit }
            on { print }
          ' README.md > notes.md
          if [ ! -s notes.md ]; then echo "Zie README.md" > notes.md; fi
          cat notes.md

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
